<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ioumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#ioumGrad)"/>

  <!-- Inner glowing circle -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" fill-opacity="0.08"/>

  <!-- Balance Scales / Two-way Arrows Symbol representing Borrow & Lend -->
  <g filter="url(#shadow)" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Up-Right Green/Emerald Arrow (Lending / You Are Owed) -->
    <path d="M 210 302 L 310 202" />
    <path d="M 230 202 L 310 202 L 310 282" />
    
    <!-- Down-Left Rose Arrow (Borrowing / You Owe) -->
    <path d="M 302 210 L 202 310" />
    <path d="M 282 310 L 202 310 L 202 230" />
  </g>

  <!-- Center subtle coin dot -->
  <circle cx="256" cy="256" r="24" fill="#ffffff" />
</svg>
